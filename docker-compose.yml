version: '3.4'
services:
  api:
    tty: true
    build:
      context: ./api
      dockerfile: Dockerfile
      target: dev-stage
    volumes:
      - ./api:/go/src/app
    ports:
      - '80:80'
      - '443:443'
    depends_on:
      - db
  db:
    tty: true
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: db
      MYSQL_ROOT_PASSWORD: '${DB_ROOT_PASSWORD}'
      MYSQL_USER: cryptrack
      MYSQL_PASSWORD: '${DB_PASSWORD}'
    volumes:
      - ./db/data:/var/lib/mysql
    