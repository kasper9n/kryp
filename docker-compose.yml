version: '3.4'
services:
  web:
    tty: true
    container_name: web
    build:
      context: ./web
      dockerfile: Dockerfile
      target: dev-stage
    environment:
      VUE_APP_API_URL: http://localhost:${API_HTTP_PORT}
      WEB_HTTP_PORT: ${WEB_HTTP_PORT}
    volumes:
      - ./web:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - api
  api:
    tty: true
    container_name: api
    build:
      context: ./api
      dockerfile: ${API_SESSION_KEY:?API_SESSION_KEY}
    command: npm run start-dev
    environment:
      NODE_ENV: development
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      API_SESSION_KEY: ${API_SESSION_KEY:?API_SESSION_KEY}
      API_HTTP_PORT: ${API_HTTP_PORT:?API_HTTP_PORT}
      API_HTTPS_PORT: ${API_HTTPS_PORT:?API_HTTPS_PORT}
      WEB_HTTP_PORT: ${WEB_HTTP_PORT:?WEB_HTTP_PORT}
      WEB_HTTPS_PORT: ${WEB_HTTPS_PORT:?WEB_HTTPS_PORT}
      DB_PORT: ${DB_PORT:?DB_PORT}
    volumes:
      - ./api:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - ${API_HTTP_PORT}:${API_HTTP_PORT}
      - ${API_HTTPS_PORT}:${API_HTTPS_PORT}
      - ${WEB_HTTP_PORT}:${WEB_HTTP_PORT} # proxy for `web`
      - ${WEB_HTTPS_PORT}:${WEB_HTTPS_PORT} # proxy for `web`
    depends_on:
      - db
  db:
    tty: true
    container_name: db
    image: mongo:4.2-bionic
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_ROOT_USERNAME:?DB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: admin
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD}
    command: mongod --auth --port ${DB_PORT:?DB_PORT}
    ports:
      - ${DB_PORT}:${DB_PORT}
    volumes:
      - ./db/data:/data/db
      - ./db/init-scripts/:/docker-entrypoint-initdb.d/
