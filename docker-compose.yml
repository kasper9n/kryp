version: '3.4'
services:
  server:
    tty: true
    container_name: server
    build:
      context: ./server
      dockerfile: Dockerfile
      target: dev-stage
    environment:
      SERVER_PORT: ${SERVER_PORT:?SERVER_PORT}
    volumes:
      - ./server:/go/src/app
    ports:
      - '${SERVER_PORT}:${SERVER_PORT}'
    depends_on:
      - db
  db:
    tty: true
    container_name: db
    image: mongo:4.2-bionic
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_ROOT_USERNAME:?DB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: admin
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD}
    command: mongod --auth --port ${DB_PORT:?DB_PORT}
    ports:
      - ${DB_PORT}:${DB_PORT}
    volumes:
      - ./db/data:/data/db
      - ./db/init-scripts/:/docker-entrypoint-initdb.d/
