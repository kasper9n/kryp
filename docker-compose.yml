version: '3.4'
services:
  web:
    tty: true
    container_name: web
    build:
      context: ./web
      dockerfile: Dockerfile
      target: dev-stage
    environment:
      NODE_ENV: development
      VUE_APP_PRODUCTION_API_URL: ${PRODUCTION_API_URL:?PRODUCTION_API_URL}
      WEB_HTTP_PORT: ${WEB_HTTP_PORT}
      VUE_APP_API_HTTP_PORT: ${API_HTTP_PORT:?API_HTTP_PORT}
      VUE_APP_API_HTTPS_PORT: ${API_HTTPS_PORT:?API_HTTPS_PORT}
    volumes:
      - ./web:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - api
  api:
    tty: true
    container_name: api
    build:
      context: ./api
      dockerfile: Dockerfile
    command: npm run start-dev
    environment:
      NODE_ENV: development
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      API_SESSION_KEY: ${API_SESSION_KEY:?API_SESSION_KEY}
      API_HTTP_PORT: ${API_HTTP_PORT:?API_HTTP_PORT}
      API_HTTPS_PORT: ${API_HTTPS_PORT:?API_HTTPS_PORT}
      WEB_HTTP_PORT: ${WEB_HTTP_PORT:?WEB_HTTP_PORT}
      WEB_HTTPS_PORT: ${WEB_HTTPS_PORT:?WEB_HTTPS_PORT}
      DB_PORT: ${DB_PORT:?DB_PORT}
    volumes:
      - ./api:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - ${API_HTTP_PORT}:${API_HTTP_PORT}
      - ${API_HTTPS_PORT}:${API_HTTPS_PORT}
      - ${WEB_HTTP_PORT}:${WEB_HTTP_PORT} # proxy for `web`
      - ${WEB_HTTPS_PORT}:${WEB_HTTPS_PORT} # proxy for `web`
    depends_on:
      - db
  db:
    tty: true
    container_name: db
    image: bitnami/mongodb:4.2
    environment:
      MONGODB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD}
      MONGODB_USERNAME: ${DB_USERNAME:?DB_USERNAME}
      MONGODB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD}
      MONGODB_DATABASE: kryp
      MONGODB_EXTRA_FLAGS: --auth --port ${DB_PORT:?DB_PORT}
    ports:
      - ${DB_PORT}:${DB_PORT}
    volumes:
      - ./mongodb:/bitnami/mongodb
