[package]
name = "kryp"
version = "0.1.0"
description = "A Tauri App"
default-run = "kryp"
edition = "2018"
build = "src/build.rs"

[build-dependencies]
tauri-build = { version = "1.0.0-beta.0" }

[dependencies]
rust_decimal = "1.13.0"
rust_decimal_macros = "1.13.0"
reqwest = "0.11.3"
tokio = { version = "1.6.0", features = ["full"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_derive = "1.0.0"
tauri = { version = "1.0.0-beta.1", features = ["api-all", "menu"] }
chrono = { version = "0.4.19", features = ["serde"] }
csv = "1.1.6"

[features]
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]

[profile.dev]
# speeds up incremental builds a lot. Should be default in a new Rust
# version: https://github.com/rust-lang/cargo/pull/9298
# https://jakedeichert.com/blog/reducing-rust-incremental-compilation-times-on-macos-by-70-percent/
split-debuginfo = "unpacked"
