[package]
name = "kryp"
version = "0.1.0"
description = "A Tauri App"
default-run = "kryp"
edition = "2018"
build = "src/build.rs"

[build-dependencies]
tauri-build = { version = "1.2", features = [] }

[dependencies]
rust_decimal = "1.13"
rust_decimal_macros = "1.13"
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1.6", features = ["full"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_derive = "1.0"
tauri = { version = "1.2", features = ["devtools", "dialog-open", "dialog-save", "shell-execute", "shell-open"] }
chrono = { version = "0.4", features = ["serde"] }
csv = "1.1"
atomicwrites = "0.3"
lazy_static = "1.4"
chrono-tz = "0.8"
localzone = { version = "0.2", features = ["auto_validation"] }

[features]
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]
